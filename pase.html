<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pase de acceso · Umbral</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { background: var(--surface); }
    .pase { min-height: 100%; max-width: 420px; margin: 0 auto; padding: 64px 28px 32px; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .pase .brand { font-size: 14px; }
    .pase .brand .logo { width: 24px; height: 24px; border-radius: 7px; }
    .pase h1 { margin-top: 48px; font-size: 24px; line-height: 30px; }
    .pase .lead { margin-top: 8px; font-size: 15px; line-height: 22px; color: var(--muted); }
    .qr-box { margin-top: 32px; padding: 20px; border: 1px solid var(--border); border-radius: 20px; background: var(--qr-bg); line-height: 0; }
    .qr-box img, .qr-box canvas { display: block; }
    .code { margin-top: 20px; font-size: 26px; font-weight: 600; letter-spacing: .18em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .pase .foot { margin-top: auto; padding-top: 40px; font-size: 12px; line-height: 18px; color: var(--muted); }
    @media (max-width: 380px) { .pase { padding: 40px 16px 24px; } .pase h1 { margin-top: 36px; } }
  </style>
</head>
<body>
  <main class="pase">
    <div class="brand"><div class="logo" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V9l8-6 8 6v12"/><path d="M10 21v-6h4v6"/></svg></div>Umbral</div>
    <h1 id="ttl">Pase de acceso</h1>
    <p class="lead" id="lead">Muestra este código en caseta para entrar.</p>
    <div class="qr-box" id="qrbox"><div id="qr" role="img" aria-label="Código QR del pase"></div></div>
    <p class="code" id="code"></p>
    <p class="foot">No necesitas instalar ninguna app.<br>Sube el brillo de tu pantalla al llegar.</p>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    (function () {
      const c = (new URLSearchParams(location.search).get("c") || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      const $ = (id) => document.getElementById(id);
      if (!c) {
        $("ttl").textContent = "Código inválido";
        $("lead").textContent = "Este enlace no trae un pase. Pide a quien te invitó que te lo envíe de nuevo.";
        $("qrbox").classList.add("hidden");
        return;
      }
      $("code").textContent = c;
      // Colores del QR desde los tokens (siempre oscuro sobre blanco)
      const css = getComputedStyle(document.documentElement);
      if (window.QRCode) new QRCode($("qr"), { text: "UMBRAL:" + c, width: 220, height: 220,
        colorDark: css.getPropertyValue("--qr-fg").trim(), colorLight: css.getPropertyValue("--qr-bg").trim() });
      else $("lead").textContent = "No se pudo dibujar el QR. Dicta en caseta el código de abajo.";
    })();
  </script>
</body>
</html>
