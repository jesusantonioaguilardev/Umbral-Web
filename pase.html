<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pase de acceso</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#111827; --muted:#6b7280; --accent:#0f766e; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0d1113; --card:#151a1d; --text:#e8ecef; --muted:#98a2ab; --accent:#2dd4bf; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; }
    .card { background:var(--card); border-radius:20px; padding:28px 22px; width:100%; max-width:360px; text-align:center; box-shadow:0 6px 30px rgba(0,0,0,.08); }
    .qr { background:#fff; padding:16px; border-radius:16px; display:inline-block; margin:18px 0 10px; }
    .code { font-family:ui-monospace,monospace; font-size:22px; font-weight:800; letter-spacing:.15em; }
    .muted { color:var(--muted); font-size:14px; }
    .tag { display:inline-block; background:var(--accent); color:#fff; padding:4px 12px; border-radius:99px; font-size:12px; font-weight:700; letter-spacing:.05em; }
  </style>
</head>
<body>
  <div class="card">
    <span class="tag">PASE DE ACCESO</span>
    <div class="qr" id="qr"></div>
    <div class="code" id="code"></div>
    <p class="muted">Muestra este código en caseta.<br>No necesitas instalar ninguna app.</p>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const c = (new URLSearchParams(location.search).get("c") || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    document.getElementById("code").textContent = c || "Código inválido";
    if (c && window.QRCode) new QRCode(document.getElementById("qr"), { text: "UMBRAL:" + c, width: 220, height: 220 });
  </script>
</body>
</html>
